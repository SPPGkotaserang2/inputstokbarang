<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Input Bahan Baku Dapur</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas untuk export ke JPG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-gradient: linear-gradient(135deg, #4f46e5, #06b6d4);
            --success-gradient: linear-gradient(135deg, #10b981, #059669);
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(79, 70, 229, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        /* Header Cerah & Berwarna */
        .header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .header-title p {
            font-size: 0.813rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .live-clock {
            background: rgba(79, 70, 229, 0.08);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 700;
            color: #4f46e5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(79, 70, 229, 0.2);
        }

        .date-filter-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(6, 182, 212, 0.08);
            padding: 0.4rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        .date-filter-box label {
            font-size: 0.875rem;
            color: #0891b2;
        }

        .date-filter-box input[type="date"] {
            border: none;
            outline: none;
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-main);
            background: transparent;
            cursor: pointer;
        }

        /* Notice Banner */
        .notice-banner {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #b45309;
            padding: 0.875rem 1.25rem;
            border-radius: 12px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.1);
        }

        /* Card Form Container */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 1.75rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 1.25rem;
            align-items: flex-end;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-control {
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #ffffff;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        select.form-control {
            cursor: pointer;
        }

        .btn {
            padding: 0.85rem 1.75rem;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.5);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5);
            transform: translateY(-2px);
        }

        .btn-danger-soft {
            background: #fee2e2;
            color: var(--danger-color);
            padding: 0.5rem 0.875rem;
            font-size: 0.875rem;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        .btn-danger-soft:hover {
            background: var(--danger-color);
            color: white;
        }

        /* Table Container */
        .table-container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .table-header-bar {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .table-header-bar h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1.125rem 2rem;
            font-size: 0.95rem;
        }

        th {
            background-color: #f8fafc;
            color: #4f46e5;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        td {
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .text-center {
            text-align: center;
        }

        .empty-state {
            padding: 3rem;
            color: var(--text-muted);
            text-align: center;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="container" id="captureArea">
    <!-- Header Profesional -->
    <div class="header">
        <div class="header-brand">
            <div class="header-title">
                <h1>SPPG KOTA SERANG SERANG SERANG 2</h1>
                <p>Jl. Kolonel Tubagus Suwandi Kav. BRI 2 No.19, Serang, Kec. Serang, Kota Serang, Banten 42116</p>
            </div>
        </div>
        
        <div class="header-controls">
            <!-- Widget Jam Live -->
            <div class="live-clock" id="liveClock">
                <i class="fa-regular fa-clock"></i> <span id="clockText">00:00:00</span>
            </div>

            <!-- Fitur Pilih Tanggal -->
            <div class="date-filter-box">
                <label for="selectedDate"><i class="fa-solid fa-calendar-days"></i></label>
                <input type="date" id="selectedDate" onchange="onDateChange()">
            </div>
        </div>
    </div>

    <!-- Peringatan jika melihat tanggal masa lalu -->
    <div class="notice-banner" id="pastDateNotice">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Anda sedang melihat data arsip masa lalu. Input data baru hanya aktif untuk hari ini.</span>
    </div>

    <!-- Form Input dengan Autocomplete (Bisa Ketik Manual atau Pilih Riwayat) -->
    <div class="card" id="formCard">
        <form id="itemForm" autocomplete="off">
            <div class="form-grid">
                <div class="form-group">
                    <label for="namaBarang">Nama Barang/Bahan Baku</label>
                    <input type="text" id="namaBarang" class="form-control" list="listNamaBarang" placeholder="" oninput="onNamaBarangInput()" required>
                    <datalist id="listNamaBarang"></datalist>
                </div>
                
                <div class="form-group">
                    <label for="satuan">Satuan</label>
                    <input type="text" id="satuan" class="form-control" list="listSatuan" placeholder="Pcs, Kg, Box, dll" required>
                    <datalist id="listSatuan"></datalist>
                </div>

                <div class="form-group">
                    <label for="jumlah">Jumlah Hari Ini</label>
                    <input type="number" id="jumlah" class="form-control" placeholder="0" min="0" required>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Simpan
                </button>
            </div>
        </form>
    </div>

    <!-- Tabel Data -->
    <div class="table-container">
        <div class="table-header-bar">
            <h2 id="tableTitle">Daftar Stock Bahan Baku</h2>
            <button type="button" class="btn btn-success" id="exportBtn" onclick="exportToJPG()">
                <i class="fa-solid fa-file-image"></i> Export ke JPG
            </button>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">No</th>
                        <th>Nama Barang/Bahan Baku</th>
                        <th style="width: 20%;">Satuan</th>
                        <th style="width: 20%;">Jumlah</th>
                        <th style="width: 10%;" class="text-center action-col">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data dimasukkan lewat Firebase Realtime listener -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Firebase SDK Compat Version -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
    // ==========================================
    // KONFIGURASI FIREBASE ANDA
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDhlkDv6EgnKv_XCc0PBYgFoDk1riAO5Vg",
        authDomain: "so-bahan-baku.firebaseapp.com",
        databaseURL: "https://so-bahan-baku-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "so-bahan-baku",
        storageBucket: "so-bahan-baku.firebasestorage.app",
        messagingSenderId: "1072738824834",
        appId: "1:1072738824834:web:95eedc782711a0f9e73a9b",
        measurementId: "G-H5TWSB47C0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Menyimpan mapping riwayat barang ke satuan terakhirnya
    let itemToSatuanMap = {};

    // Live Clock Function
    function updateLiveClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clockText').innerText = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateLiveClock, 1000);

    function getFormattedDate(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function getCurrentSelectedDate() {
        return document.getElementById('selectedDate').value || getFormattedDate();
    }

    function initDatePicker() {
        const today = getFormattedDate();
        const dateInput = document.getElementById('selectedDate');
        dateInput.value = today;
    }

    function onDateChange() {
        renderUIState();
        listenToDailyData();
    }

    function renderUIState() {
        const selectedDate = getCurrentSelectedDate();
        const today = getFormattedDate();
        const formCard = document.getElementById('formCard');
        const noticeBanner = document.getElementById('pastDateNotice');
        const tableTitle = document.getElementById('tableTitle');

        const dateObj = new Date(selectedDate + 'T00:00:00');
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const formattedName = dateObj.toLocaleDateString('id-ID', options);

        tableTitle.innerText = `Daftar Stock Barang/Bahan Baku (${formattedName})`;

        if (selectedDate !== today) {
            formCard.style.display = 'none';
            noticeBanner.style.display = 'flex';
        } else {
            formCard.style.display = 'block';
            noticeBanner.style.display = 'none';
        }
    }

    let currentRef = null;
    function listenToDailyData() {
        const selectedDate = getCurrentSelectedDate();
        
        if (currentRef) {
            currentRef.off();
        }

        currentRef = db.ref('stock_barang/' + selectedDate);
        currentRef.on('value', (snapshot) => {
            const dataObj = snapshot.val();
            renderTable(dataObj);
        });
    }

    // Mengambil data riwayat untuk Datalist (bisa ketik manual / autocomplete)
    function loadMasterDataList() {
        db.ref('stock_barang').once('value', (snapshot) => {
            const allDatesData = snapshot.val();
            const uniqueBarangSet = new Set();
            const uniqueSatuanSet = new Set();
            itemToSatuanMap = {};

            if (allDatesData) {
                Object.keys(allDatesData).forEach(dateKey => {
                    const itemsOnDate = allDatesData[dateKey];
                    if (itemsOnDate) {
                        Object.keys(itemsOnDate).forEach(itemKey => {
                            const item = itemsOnDate[itemKey];
                            if (item && item.nama) {
                                const namaTrim = item.nama.trim();
                                uniqueBarangSet.add(namaTrim);
                                if (item.satuan) {
                                    const satuanTrim = item.satuan.trim();
                                    uniqueSatuanSet.add(satuanTrim);
                                    itemToSatuanMap[namaTrim] = satuanTrim;
                                }
                            }
                        });
                    }
                });
            }

            // Populate Datalist Nama Barang
            const listNama = document.getElementById('listNamaBarang');
            listNama.innerHTML = '';
            Array.from(uniqueBarangSet).sort().forEach(nama => {
                const opt = document.createElement('option');
                opt.value = nama;
                listNama.appendChild(opt);
            });

            // Populate Datalist Satuan
            const listSatuan = document.getElementById('listSatuan');
            listSatuan.innerHTML = '';
            Array.from(uniqueSatuanSet).sort().forEach(satuan => {
                const opt = document.createElement('option');
                opt.value = satuan;
                listSatuan.appendChild(opt);
            });
        });
    }

    // Otomatis mengisi satuan jika nama barang yang diketik sama dengan riwayat sebelumnya
    function onNamaBarangInput() {
        const inputNama = document.getElementById('namaBarang');
        const inputSatuan = document.getElementById('satuan');
        const val = inputNama.value.trim();

        if (itemToSatuanMap[val]) {
            inputSatuan.value = itemToSatuanMap[val];
        }
    }

    function renderTable(dataObj) {
        const tbody = document.getElementById('tableBody');
        const selectedDate = getCurrentSelectedDate();
        const isToday = (selectedDate === getFormattedDate());
        tbody.innerHTML = '';

        if (!dataObj) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>Tidak ada data stock barang untuk tanggal ini.</p>
                    </td>
                </tr>
            `;
            return;
        }

        let index = 0;
        Object.keys(dataObj).forEach(key => {
            const item = dataObj[key];
            index++;
            const tr = document.createElement('tr');
            
            const actionButton = isToday ? `
                <button class="btn btn-danger-soft" onclick="deleteItem('${key}')" title="Hapus">
                    <i class="fa-solid fa-trash"></i>
                </button>
            ` : `<span style="color: var(--text-muted); font-size: 0.85rem;">Arsip</span>`;

            tr.innerHTML = `
                <td>${index}</td>
                <td><strong>${escapeHtml(item.nama)}</strong></td>
                <td>${escapeHtml(item.satuan)}</td>
                <td><strong>${item.jumlah}</strong></td>
                <td class="text-center action-col">
                    ${actionButton}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('itemForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const selectedDate = getCurrentSelectedDate();
        const today = getFormattedDate();

        if (selectedDate !== today) {
            alert('Anda hanya dapat menginput data untuk hari ini!');
            return;
        }

        const nama = document.getElementById('namaBarang').value.trim();
        const satuan = document.getElementById('satuan').value.trim();
        const jumlah = parseInt(document.getElementById('jumlah').value);

        if (!nama || !satuan || isNaN(jumlah)) return;

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

        let isCompleted = false;
        const timeoutTimer = setTimeout(() => {
            if (!isCompleted) {
                isCompleted = true;
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Simpan`;
                alert("Koneksi ke server lambat atau terhalang. Periksa kembali aturan Rules Firebase Anda.");
            }
        }, 7000);

        const ref = db.ref('stock_barang/' + selectedDate);
        ref.orderByChild('nama').equalTo(nama).once('value', (snapshot) => {
            if (isCompleted) return;
            isCompleted = true;
            clearTimeout(timeoutTimer);

            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const existingKey = childSnapshot.key;
                    const existingData = childSnapshot.val();
                    const newJumlah = parseInt(existingData.jumlah) + jumlah;
                    
                    ref.child(existingKey).update({
                        jumlah: newJumlah,
                        satuan: satuan
                    });
                });
            } else {
                ref.push({
                    nama: nama,
                    satuan: satuan,
                    jumlah: jumlah
                });
            }

            document.getElementById('itemForm').reset();
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Simpan`;
            
            loadMasterDataList();
        }, (error) => {
            if (isCompleted) return;
            isCompleted = true;
            clearTimeout(timeoutTimer);

            console.error("Gagal menyimpan data:", error);
            alert("Gagal menyimpan data! Error: " + error.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Simpan`;
        });
    });

    window.deleteItem = function(key) {
        if (confirm('Apakah Anda yakin ingin menghapus data ini?')) {
            const selectedDate = getCurrentSelectedDate();
            db.ref('stock_barang/' + selectedDate + '/' + key).remove().then(() => {
                loadMasterDataList();
            });
        }
    };

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.exportToJPG = function() {
        const formCard = document.getElementById('formCard');
        const actionCols = document.querySelectorAll('.action-col');
        const exportBtn = document.getElementById('exportBtn');
        const noticeBanner = document.getElementById('pastDateNotice');

        if (formCard) formCard.style.display = 'none';
        if (noticeBanner) noticeBanner.style.display = 'none';
        actionCols.forEach(el => el.style.display = 'none');
        exportBtn.style.display = 'none';

        const captureArea = document.getElementById('captureArea');
        const selectedDate = getCurrentSelectedDate();

        html2canvas(captureArea, {
            scale: 2,
            backgroundColor: '#ffffff',
            logging: false,
            useCORS: true
        }).then(canvas => {
            renderUIState();
            actionCols.forEach(el => el.style.display = '');
            exportBtn.style.display = 'inline-flex';

            const link = document.createElement('a');
            link.download = `Laporan-Stock-${selectedDate}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        }).catch(err => {
            console.error('Gagal export gambar:', err);
            renderUIState();
            actionCols.forEach(el => el.style.display = '');
            exportBtn.style.display = 'inline-flex';
            alert('Terjadi kesalahan saat mengeksport gambar.');
        });
    };

    window.onload = function() {
        initDatePicker();
        updateLiveClock();
        renderUIState();
        listenToDailyData();
        loadMasterDataList();
    };
</script>

</body>
</html>
